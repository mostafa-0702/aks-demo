name: CI/CD — Build and Deploy to AKS

on:
  push:
    branches: [ main ]

env:
  ACR_NAME: myacrdemorepo
  RESOURCE_GROUP: rg-aks-demo
  CLUSTER_NAME: aks-demo-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Login Azure avec client-secret (méthode classique SP)
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

    - name: Login to ACR
      run: |
        az acr login --name ${{ env.ACR_NAME }}

    - name: Build and Push Backend
      run: |
        az acr build \
          --registry ${{ env.ACR_NAME }} \
          --image backend:${{ github.sha }} \
          --file app/backend/Dockerfile \
          ./app/backend

    - name: Build and Push Frontend
      run: |
        az acr build \
          --registry ${{ env.ACR_NAME }} \
          --image frontend:${{ github.sha }} \
          --file app/frontend/Dockerfile \
          --build-arg REACT_APP_API_URL=https://acity.work \
          ./app/frontend

    - name: Get AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ env.RESOURCE_GROUP }}
        cluster-name: ${{ env.CLUSTER_NAME }}

    - name: Deploy to AKS
      run: |
        kubectl set image deployment/backend \
          backend=${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}

        kubectl set image deployment/frontend \
          frontend=${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}

        kubectl rollout status deployment/backend
        kubectl rollout status deployment/frontend

    - name: Verify deployment
      run: |
        kubectl get pods
        kubectl get ingress