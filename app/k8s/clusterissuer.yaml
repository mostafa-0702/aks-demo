apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Serveur Let's Encrypt production
    server: https://acme-v02.api.letsencrypt.org/directory
    # Ton email pour recevoir les alertes d'expiration
    email: mostafa.lagnaoui@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx